services:
  api:
    build: .
    image: rag-credit-copilot:latest
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      # Не берётся из .env: там localhost для запуска без Docker, а из контейнера
      # Ollama на хосте доступна только через host.docker.internal.
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  streamlit:
    # Тот же образ, что у api: собирается один раз.
    image: rag-credit-copilot:latest
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
